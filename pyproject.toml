[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "native-app-factory"
version = "0.7.0"
description = "Configuration-driven native build factory for Capacitor and Expo apps"
requires-python = ">=3.11"
dependencies = ["Flask>=3.1,<4", "PyYAML>=6.0,<7", "waitress>=3.0,<4"]

[project.optional-dependencies]
dev = ["ruff>=0.6,<1"]

[project.scripts]
native-factory = "native_factory.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/native_factory"]

[tool.hatch.build.targets.wheel.force-include]
"templates" = "native_factory/templates"
"src/native_factory/studio_static" = "native_factory/studio_static"

[tool.ruff]
line-length = 100
